plugins {
    id 'com.android.application'
}

android {
    namespace 'com.batteryprotect.scheduler'
    compileSdk 36

    defaultConfig {
        applicationId "com.batteryprotect.scheduler"
        minSdk 31
        targetSdk 36
        versionCode 7
        versionName "1.1.3"
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
